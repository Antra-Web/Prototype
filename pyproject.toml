[project]
name = "slide_share_research_agent"
version = "0.1.0"
description = "slide_share_research_agent using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[file-processing,litellm,tools]>=1.15.22,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slide_share_research_agent"]

[tool.crewai]
type = "flow"
definition = "src/slide_share_research_agent/flow.json"
project_id = "78857ff8-a623-4afb-82ff-6c997f705551"

[tool.uv]
override-dependencies = ["litellm<=1.82.6"]
